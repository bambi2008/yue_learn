name: yue_learn
description: "粤讲粤易 - 港式粤语学习App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.9.42
  http: ^1.2.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  record: ^7.1.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/dining/
    - assets/audio/transport/
    - assets/audio/shopping/
    - assets/audio/workplace/
    - assets/images/
